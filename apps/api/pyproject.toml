[project]
name = "asfeedback-api"
version = "0.1.0"
description = "A&S Feedback Hub — API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # [email] traz o email-validator, exigido por `EmailStr` nos schemas de identity.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "redis>=5.2",
    "python-multipart>=0.0.12",
    # Exportações do worker (AD-07). No legado eram jspdf/xlsx no browser, e um
    # relatório grande travava a aba de quem pediu.
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# O worker vive fora de apps/api mas importa `app.*` como biblioteca; uma suíte só
# cobre os dois, e é ela que garante que o contrato entre eles não se quebre em
# silêncio.
pythonpath = [".", "../worker"]
