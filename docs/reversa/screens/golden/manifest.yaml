  source: "_reversa_sdd/<unit>/screenshots/ (originais); índice em _reversa_sdd/<unit>/screens.md"
  capturedAt: "2026-08-28 (sessões 10:11–10:28 e 10:45–10:58)"
  note: >
    Os 83 screenshots do Visor são o oráculo do subset literal (35 telas).
    O subset modernizado (8 telas) não tem golden; paridade é semântica (parity_specs.md).

capture_suggestion:
  tool: "playwright"
  command_template: "npx playwright screenshot --viewport-size=1440,900 --wait-for-timeout=2000 '{url}' golden/{screen_id}.png"
  determinism:
    - "dados seed fixos no tenant de staging"
    - "relógio congelado (mock de Date) para datas exibidas"
    - "tema claro como padrão de captura"

