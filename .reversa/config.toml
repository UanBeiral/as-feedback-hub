# Reversa — Configuração do Projeto
# Este arquivo é gerenciado pelo instalador. Para customizações, edite config.user.toml

[project]
name = "as-feedback-hub"
version = "1.0.0"

[user]
name = "Uan"
chat_language = "pt-br"
doc_language = "Português"

[output]
# As specs da migração já vivem em `docs/reversa/` neste repositório, copiadas do
# projeto legado no handoff. Apontar o Reversa para lá evita a duplicata que
# divergiria: dois lugares com a mesma spec viram duas verdades em poucas semanas.
folder = "docs/reversa"

[agents]
installed = [
  "reversa",
  "reversa-autonomous",
  "reversa-scout",
  "reversa-archaeologist",
  "reversa-detective",
  "reversa-architect",
