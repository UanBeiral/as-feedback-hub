  "reversa-design-system",
  "reversa-agents-help",
  "reversa-reconstructor",
  "reversa-debugger",
  "reversa-debugger-fix",
  "reversa-debugger-debate",
  "reversa-depth-inspection",
  "reversa-debugger-graph",
  "reversa-migrate",
  "reversa-paradigm-advisor",
  "reversa-curator",
  "reversa-strategist",
  "reversa-designer",
  "reversa-screen-translator",
  "reversa-inspector",
  "reversa-forward",
  "reversa-requirements",
  "reversa-clarify",
  "reversa-plan",
  "reversa-to-do",
  "reversa-audit",
  "reversa-quality",
  "reversa-coding",
  "reversa-code-express",
  "reversa-add",
  "reversa-sync",
  "reversa-principles",
  "reversa-resume",
  "reversa-brainstorm",
  "reversa-framer",
