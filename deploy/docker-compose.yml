# Deploy único da VPS (AD-01). Um Compose, quatro processos e dois armazenamentos.
# Nada aqui é gerenciado por terceiro: foi essa a restrição do brief que motivou a
# saída do Supabase.
#
# ESTADO ATUAL: `postgres`, `redis`, `api`, `worker` e `web` sobem. `nginx` segue
# comentado até haver certificado TLS na VPS — ele é o último passo do deploy, não do
# desenvolvimento.
#
# O `redis` ainda não é usado por ninguém: a fila do outbox é o próprio Postgres
# (polling por `status='pending'`, como descreve target_data_model.md). Ele fica de pé
# para o cache e para o que vier depois.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-asfeedback}
    ports:
      # Exposto só em localhost, para rodar Alembic e psql da máquina de dev.
      # Em produção, remova esta seção: o banco não precisa de porta publicada.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # O worker é o único processo que roda o scheduler. O despacho do outbox escala
    # sem susto (FOR UPDATE SKIP LOCKED dá conta), mas o scheduler não: subir uma
    # segunda réplica faria o fechamento de ciclo rodar em duplicata enquanto não
    # houver eleição de líder (AD-05).
    deploy:
      replicas: 1

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # O front fala com a API pela rede interna do compose; o navegador nunca vê
      # este endereço, porque as chamadas passam pelo rewrite do próprio Next.
      API_ORIGIN: http://api:8000
    depends_on:
      - api
    expose:
      - "3000"

  # nginx:
  #   image: nginx:1.27-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./nginx/proxy_headers.conf:/etc/nginx/conf.d/proxy_headers.conf:ro
  #     - ./nginx/certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - api
  #     - web

volumes:
  postgres_data:
  redis_data:
