# Deploy único da VPS (AD-01). Um Compose, quatro processos e dois armazenamentos.
# Nada aqui é gerenciado por terceiro: foi essa a restrição do brief que motivou a
# saída do Supabase.
#
# ESTADO ATUAL: `postgres`, `redis`, `api`, `worker` e `web` sobem. `nginx` segue
# comentado até haver certificado TLS na VPS — ele é o último passo do deploy, não do
# desenvolvimento.
#
# O `redis` ainda não é usado por ninguém: a fila do outbox é o próprio Postgres
# (polling por `status='pending'`, como descreve target_data_model.md). Ele fica de pé
# para o cache e para o que vier depois.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-asfeedback}
    ports:
      # Exposto só em localhost, para rodar Alembic e psql da máquina de dev.
      # Em produção, remova esta seção: o banco não precisa de porta publicada.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # O `.env` aponta para `localhost` porque é o que serve a quem roda a API na
      # máquina, fora do compose. Dentro de um container, `localhost` é o próprio
      # container — o banco e o Redis são alcançados pelo nome do serviço. Este bloco
      # sobrescreve o `env_file`, que é carregado antes.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-asfeedback}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # O `.env` aponta para `localhost` porque é o que serve a quem roda a API na
      # máquina, fora do compose. Dentro de um container, `localhost` é o próprio
      # container — o banco e o Redis são alcançados pelo nome do serviço. Este bloco
      # sobrescreve o `env_file`, que é carregado antes.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-asfeedback}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # O worker é o único processo que roda o scheduler. O despacho do outbox escala
    # sem susto (FOR UPDATE SKIP LOCKED dá conta), mas o scheduler não: subir uma
    # segunda réplica faria o fechamento de ciclo rodar em duplicata enquanto não
    # houver eleição de líder (AD-05).
    deploy:
      replicas: 1

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Precisa ser build arg, e não variável de runtime: o Next resolve o destino
        # do rewrite durante o build. O navegador nunca vê este endereço — ele chama
        # /api na própria origem, e quem encaminha é o servidor do Next.
        API_ORIGIN: http://api:8000
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      - api
    expose:
      - "3000"
    ports:
      # Publicado só em localhost, como o Postgres e a API. Em produção quem atende a
      # internet é o Nginx (AD-06) e esta seção sai — o web não precisa de porta
      # própria quando há proxy na frente.
      - "127.0.0.1:3000:3000"

  # nginx:
  #   image: nginx:1.27-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./nginx/proxy_headers.conf:/etc/nginx/conf.d/proxy_headers.conf:ro
  #     - ./nginx/certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - api
  #     - web

volumes:
  postgres_data:
  redis_data:
