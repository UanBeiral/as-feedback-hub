  #     dockerfile: deploy/worker.Dockerfile
  #   restart: unless-stopped
  #   env_file: ../.env
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   # O worker é o único processo que roda o scheduler. Escalar réplicas exige
  #   # antes resolver a eleição de líder, senão o fechamento de ciclo roda em
  #   # duplicata (AD-05).
  #   deploy:
