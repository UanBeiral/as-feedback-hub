  #   restart: unless-stopped
  #   env_file: ../.env
  #   depends_on:
  #     - api
  #   expose:
  #     - "3000"

  # nginx:
  #   image: nginx:1.27-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
