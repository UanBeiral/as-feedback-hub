# Deploy único da VPS (AD-01). Um Compose, quatro processos e dois armazenamentos.
# Nada aqui é gerenciado por terceiro: foi essa a restrição do brief que motivou a
# saída do Supabase.
#
# ESTADO ATUAL: só `postgres`, `redis` e `api` sobem hoje. Os serviços `worker`, `web`
# e `nginx` estão comentados porque o código deles ainda não existe (fase Fundação
# entregou a API). Descomente cada um junto com o contexto correspondente:
#   worker → contexto `engagement` (outbox + scheduler, AD-04/AD-05)
#   web    → app Next.js em apps/web
#   nginx  → depois que `web` existir, senão o upstream não resolve no boot

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-asfeedback}
    ports:
      # Exposto só em localhost, para rodar Alembic e psql da máquina de dev.
      # Em produção, remova esta seção: o banco não precisa de porta publicada.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"

  # worker:
