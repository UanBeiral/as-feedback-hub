# Headers de proxy compartilhados por todos os `location`.
#
# Atenção ao X-Forwarded-For: `$proxy_add_x_forwarded_for` ANEXA o endereço da conexão
# ao valor que o cliente mandou, então o primeiro elemento da lista é escrito por quem
# está do outro lado e não vale como identidade. Quem precisa do IP real usa
# X-Real-IP, que é sobrescrito aqui a cada requisição (ver `core/di.client_ip`).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_read_timeout 60s;
