# Nginx: TLS, roteamento e o rate limiting do endpoint público.
#
# O limite do `/api/v1/public/` não é higiene genérica: aquele endpoint aceita
# requisição sem autenticação, identificada só por um token de link (BR-MIGRAR-019).
# Sem limite, ele é um oráculo para adivinhar tokens por força bruta.

limit_req_zone $binary_remote_addr zone=publico:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

upstream api_upstream { server api:8000; }
upstream web_upstream { server web:3000; }

server {
    listen 80;
    server_name _;
    # ACME continua acessível em HTTP para renovação de certificado.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location /api/v1/public/ {
        limit_req zone=publico burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    location /api/ {
        proxy_pass http://api_upstream;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    location / {
        proxy_pass http://web_upstream;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }
}
